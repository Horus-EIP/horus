name: Bug report
description: A tool of the kit fails, or gives a wrong result.
labels: [bug, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report it. Use synthetic data in what you paste: no private documents, no API keys.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest test set, catalog or report that shows the problem helps most.
      placeholder: |
        1. hbk-eval validate my-testset.json
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version
      description: The output of `hbk-eval --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.7"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: The console output, or the part of the report that is wrong.
