name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome a first contribution
    if: >-
      ${{ (github.event_name == 'issues'
      && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
      || (github.event_name == 'pull_request_target'
      && contains(fromJSON('["FIRST_TIME_CONTRIBUTOR", "FIRST_TIMER"]'), github.event.pull_request.author_association)) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            Welcome, and thanks for the issue! A maintainer will look at it soon. If you would like to fix it yourself, say so in a comment, and a maintainer will tell you how to go on.
          pr_message: |
            Welcome, and thanks for the pull request! CI may wait for a maintainer to approve its first run, then a maintainer reviews it. Check that every commit is signed off (`git commit -s`) and that the description says `Fixes #N`.
