name: CI

on:
  push:
    branches: [master, main, pre-release-fix]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.13'

  # Opt in to Node.js 24 for JavaScript-based actions (actions/checkout@v4,
  # actions/setup-python@v5, etc.) before it becomes the default on
  # 2026-06-16. Silences the deprecation warning and avoids the forced
  # cutover surprising us.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

  # CI database / cache / queue defaults — overridden per job where needed
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: mas_db
  DB_HOST: localhost
  DB_PORT: 5432
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  REDIS_PASSWORD: ''
  RABBITMQ_HOST: localhost
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  JWT_SECRET_KEY: ci-secret-not-for-production
  JWT_ALGORITHM: HS256
  SUPER_USER_USERNAME: admin
  SUPER_USER_PASSWORD: admin
  LLM_AUTOINIT: '0'
  LLM_FORCE_CPU: '1'
  OTEL_SDK_DISABLED: 'true'
  OTEL_ENABLED: 'false'

jobs:
  # ----------------------------------------------------------------------- #
  # Fast lint — runs in parallel with everything else
  # ----------------------------------------------------------------------- #
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: Run ruff
        run: ruff check src tests scripts installer packaging

  # ----------------------------------------------------------------------- #
  # MAS unit tests with coverage
  # ----------------------------------------------------------------------- #
  test-mas:
    name: Tests · MAS
    runs-on: ubuntu-latest
    # No service containers. The suite is MOSTLY hermetic: SQLite stands in for
    # Postgres, fakeredis for Redis, RabbitMQ is mocked. It is not fully hermetic
    # yet: test_config, test_auth_helpers, test_rabbitmq_manager and test_auth read
    # through core.config, which falls back to an all-None DummySettings when the
    # required settings are absent, so they need the .env written by the step below.
    # That step is a WORKAROUND; making the suite genuinely hermetic is tracked in
    # docs/eip/post-beta.md.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/services/mas/requirements-cpu.txt

      - name: Install MAS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/services/mas/requirements-cpu.txt
          pip install pytest-cov fakeredis

      - name: Provide test configuration (workaround, see docs/eip/post-beta.md)
        run: cp src/infra/.env.example src/infra/.env

      - name: Run MAS tests with coverage
        working-directory: ${{ github.workspace }}
        run: |
          pytest -c tests/mas/pytest.ini tests/mas \
            -m "not requires_stack" \
            --ignore=tests/mas/test_integration.py \
            --cov=src/services/mas \
            --cov-branch \
            --cov-fail-under=85 \
            --cov-report=xml:coverage-mas.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov-mas \
            --junitxml=junit-mas.xml

      - name: Upload coverage and junit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mas
          path: |
            coverage-mas.xml
            junit-mas.xml
            htmlcov-mas/
          retention-days: 14

  # ----------------------------------------------------------------------- #
  # Agent unit tests with coverage
  # ----------------------------------------------------------------------- #
  test-agent:
    name: Tests · Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/services/agent/requirements.txt

      - name: Install Agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/services/agent/requirements.txt
          pip install pytest-cov

      - name: Run Agent unit tests with coverage
        run: |
          pytest -c tests/agent/pytest.ini tests/agent \
            --cov=src/services/agent \
            --cov-branch \
            --cov-fail-under=90 \
            --cov-report=xml:coverage-agent.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov-agent \
            --junitxml=junit-agent.xml

      - name: Upload coverage and junit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent
          path: |
            coverage-agent.xml
            junit-agent.xml
            htmlcov-agent/
          retention-days: 14

  # ----------------------------------------------------------------------- #
  # Knowledge Store unit tests with coverage
  # ----------------------------------------------------------------------- #
  test-knowledge-store:
    name: Tests · Knowledge Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/services/knowledge-store/requirements.txt

      - name: Install Knowledge Store dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/services/knowledge-store/requirements.txt
          pip install pytest-cov

      - name: Run Knowledge Store unit tests with coverage
        run: |
          pytest -c tests/knowledge_store/pytest.ini tests/knowledge_store \
            --cov=src/services/knowledge-store \
            --cov-branch \
            --cov-fail-under=85 \
            --cov-report=xml:coverage-ks.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov-ks \
            --junitxml=junit-ks.xml

      - name: Upload coverage and junit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-knowledge-store
          path: |
            coverage-ks.xml
            junit-ks.xml
            htmlcov-ks/
          retention-days: 14

  # ----------------------------------------------------------------------- #
  # Integration tests — moved to scripts/integration-checks/ per
  # tests/TESTING_PLAN.md. They require the live Docker stack and run only
  # when manually invoked from the runbook (see docs/eip/performance.md).
  # CI no longer runs them.
  # ----------------------------------------------------------------------- #

  # ----------------------------------------------------------------------- #
  # Coverage summary — runs after all unit-test jobs, posts a table to the
  # workflow summary tab + downloadable HTML coverage reports for the jury.
  # ----------------------------------------------------------------------- #
  coverage-summary:
    name: Coverage summary
    runs-on: ubuntu-latest
    if: always()
    needs: [test-mas, test-agent, test-knowledge-store]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: artifacts
          merge-multiple: true

      - name: Render coverage + tests summary
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, glob, xml.etree.ElementTree as ET

          # ---- Coverage -------------------------------------------------- #
          cov_rows = []
          for xml in sorted(glob.glob("artifacts/coverage-*.xml")):
              name = os.path.basename(xml).replace("coverage-", "").replace(".xml", "")
              try:
                  root = ET.parse(xml).getroot()
                  line_rate = float(root.attrib.get("line-rate", 0)) * 100
                  branch_rate = float(root.attrib.get("branch-rate", 0)) * 100
                  lines_covered = int(root.attrib.get("lines-covered", 0))
                  lines_valid = int(root.attrib.get("lines-valid", 0))
                  cov_rows.append((name, line_rate, branch_rate, lines_covered, lines_valid))
              except Exception as e:
                  cov_rows.append((name, 0.0, 0.0, 0, 0))
                  print(f"  warn: could not parse {xml}: {e}")

          # ---- Tests (junit) -------------------------------------------- #
          test_rows = []
          for xml in sorted(glob.glob("artifacts/junit-*.xml")):
              name = os.path.basename(xml).replace("junit-", "").replace(".xml", "")
              try:
                  root = ET.parse(xml).getroot()
                  # junit-xml: top tag is either <testsuites> or <testsuite>
                  suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
                  tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
                  failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
                  errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
                  skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
                  time_s = sum(float(s.attrib.get("time", 0)) for s in suites)
                  passed = tests - failures - errors - skipped
                  test_rows.append((name, tests, passed, failures, errors, skipped, time_s))
              except Exception as e:
                  test_rows.append((name, 0, 0, 0, 0, 0, 0.0))
                  print(f"  warn: could not parse {xml}: {e}")

          # ---- Render --------------------------------------------------- #
          icon = lambda pct: "🟢" if pct >= 80 else ("🟡" if pct >= 60 else "🔴")
          lines = ["## Test results", ""]

          if test_rows:
              lines += [
                  "| Service | Tests | Passed | Failed | Errors | Skipped | Time |",
                  "|---------|------:|-------:|-------:|-------:|--------:|-----:|",
              ]
              for name, total, p, f_, e_, sk, t in test_rows:
                  status = "✅" if (f_ + e_) == 0 and total > 0 else "❌"
                  lines.append(
                      f"| {status} **{name}** | {total} | {p} | {f_} | {e_} | {sk} | {t:.1f}s |"
                  )
          else:
              lines.append("_no junit artifacts found_")

          lines += ["", "## Coverage", ""]
          if cov_rows:
              lines += [
                  "| Service | Line | Branch | Lines covered |",
                  "|---------|-----:|-------:|---------------|",
              ]
              for name, line_rate, branch_rate, covered, total in cov_rows:
                  lines.append(
                      f"| {icon(line_rate)} **{name}** | {line_rate:5.1f} % | {branch_rate:5.1f} % | {covered:,} / {total:,} |"
                  )
              # totals row
              tot_cov = sum(r[3] for r in cov_rows)
              tot_lines = sum(r[4] for r in cov_rows)
              tot_rate = (tot_cov / tot_lines * 100) if tot_lines else 0.0
              lines.append(
                  f"| {icon(tot_rate)} **TOTAL** | **{tot_rate:5.1f} %** | — | **{tot_cov:,} / {tot_lines:,}** |"
              )
          else:
              lines.append("_no coverage artifacts found_")

          # ---- How to view the full HTML coverage --------------------- #
          repo = os.environ.get("REPO", "OWNER/REPO")
          run_id = os.environ.get("RUN_ID", "RUN_ID")
          lines += [
              "",
              "## Full HTML coverage reports",
              "",
              f"Download from the **Artifacts** section at the bottom of [this run]"
              f"(https://github.com/{repo}/actions/runs/{run_id}):",
              "",
              "- `coverage-mas` — unzip → open `htmlcov-mas/index.html`",
              "- `coverage-agent` — unzip → open `htmlcov-agent/index.html`",
              "- `coverage-knowledge-store` — unzip → open `htmlcov-ks/index.html`",
              "",
              "Legend: 🟢 ≥ 80 % · 🟡 60–80 % · 🔴 < 60 %",
              "",
          ]
          summary = "\n".join(lines) + "\n"

          out = os.environ.get("GITHUB_STEP_SUMMARY")
          if out:
              with open(out, "a") as f:
                  f.write(summary)
          print(summary)
          PY

      - name: Upload combined coverage XMLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: artifacts/coverage-*.xml
          retention-days: 30
