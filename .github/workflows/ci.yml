name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install MAS dependencies
        working-directory: src/services/mas
        run: pip install -r requirements.txt
      - name: Run MAS tests
        working-directory: src/services/mas
        run: pytest -vv --maxfail=1 --disable-warnings --cov=.
