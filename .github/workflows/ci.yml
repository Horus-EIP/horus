name: CI

on: [push, pull_request]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: src/services/mas/requirements.txt

      - name: Start Infrastructure Services
        run: |
          cd src/infra
          docker compose up -d postgres redis rabbitmq
          # Wait for Postgres to be ready
          timeout 60s bash -c 'until docker compose exec -T postgres pg_isready; do sleep 2; done'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/services/mas/requirements.txt

      - name: Start MAS Service
        run: |
          # Load .env variables
          if [ -f src/infra/.env ]; then
            export $(grep -v '^#' src/infra/.env | sed 's/#.*//g' | xargs)
          fi
          
          # Override for CI (localhost access)
          export DB_HOST=localhost
          export REDIS_HOST=localhost
          export RABBITMQ_HOST=localhost
          export LLM_AUTOINIT=0
          
          # Move to service directory
          cd src/services/mas
          export PYTHONPATH=$PYTHONPATH:$(pwd)

          # Run migrations
          (cd db && alembic upgrade head)
          
          # Init DB
          python -c "from db.init_setup import init_db; init_db()"
          
          # Start Server
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > mas.log 2>&1 &
          
          # Wait for Server to be ready
          echo "Waiting for MAS service to start..."
          timeout 30s bash -c 'until curl -s http://localhost:8000/docs > /dev/null; do sleep 1; done'
          echo "MAS service started!"

      - name: Run Unit Tests
        run: |
          # Load .env variables
          if [ -f src/infra/.env ]; then
            export $(grep -v '^#' src/infra/.env | sed 's/#.*//g' | xargs)
          fi
          
          # Override for CI (localhost access)
          export DB_HOST=localhost
          export REDIS_HOST=localhost
          export RABBITMQ_HOST=localhost
          export LLM_AUTOINIT=0
          
          # Move to service directory
          cd src/services/mas
          export PYTHONPATH=$PYTHONPATH:$(pwd)

          # Run tests
          pytest tests/ --ignore=tests/test_integration.py

  test-integration:
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: src/services/mas/requirements.txt

      - name: Start Infrastructure Services
        run: |
          cd src/infra
          docker compose up -d postgres redis rabbitmq
          # Wait for Postgres to be ready
          timeout 60s bash -c 'until docker compose exec -T postgres pg_isready; do sleep 2; done'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/services/mas/requirements.txt
          pip install pytest pytest-asyncio httpx websockets

      - name: Start MAS Service
        run: |
          # Load .env variables
          if [ -f src/infra/.env ]; then
            export $(grep -v '^#' src/infra/.env | sed 's/#.*//g' | xargs)
          fi
          
          # Override for CI
          export DB_HOST=localhost
          export REDIS_HOST=localhost
          export RABBITMQ_HOST=localhost
          export LLM_AUTOINIT=0
          
          cd src/services/mas
          
          # Run migrations
          (cd db && alembic upgrade head)
          
          # Init DB
          python -c "from db.init_setup import init_db; init_db()"
          
          # Start Server
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > mas.log 2>&1 &
          
          # Wait for Server to be ready
          echo "Waiting for MAS service to start..."
          timeout 30s bash -c 'until curl -s http://localhost:8000/docs > /dev/null; do sleep 1; done'
          echo "MAS service started!"

      - name: Run Integration Tests
        env:
          TEST_BASE_URL: http://localhost:8000
          TEST_WS_BASE_URL: ws://localhost:8000
        run: |
          pytest src/services/mas/tests/test_integration.py
          if [ $? -ne 0 ]; then cat src/services/mas/mas.log; exit 1; fi
