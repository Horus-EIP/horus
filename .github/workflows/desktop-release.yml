name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Installer tests and asset checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/services/PYTHON_VERSION

      - name: Installer unit tests
        run: python -m unittest discover -s installer/tests -t .

      - name: Version numbers match VERSION
        run: python scripts/ci/check-versions.py

      - name: The release tag names VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/ci/check-versions.py --tag "$GITHUB_REF_NAME"

      - name: The bundle builds without the apps
        run: python packaging/build_bundle.py --out dist-check

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (Horus.exe)
            os: windows-latest
          - label: macOS (Horus.app, universal)
            os: macos-latest
          - label: Linux (.deb)
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file

      - name: Install Rust
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Add the macOS targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        run: npm run build:windows

      - name: Build (macOS universal)
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        run: npm run build:macos

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: desktop
        run: npm run build:linux

      - name: Collect the Windows binary
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p app
          built="desktop/src-tauri/target/release/Horus.exe"
          if [ ! -f "$built" ]; then
            built="$(find desktop/src-tauri/target/release -maxdepth 1 -iname '*.exe' | head -n 1)"
            echo "Horus.exe not found; falling back to ${built:-nothing}"
          fi
          if [ -z "$built" ] || [ ! -f "$built" ]; then
            echo "no .exe was produced"
            ls -l desktop/src-tauri/target/release || true
            exit 1
          fi
          cp "$built" app/Horus.exe
          ls -l app

      - name: Collect the macOS app
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p app
          src="desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Horus.app"
          if [ ! -d "$src" ]; then
            echo "no Horus.app was produced"
            find desktop/src-tauri/target -maxdepth 6 -name '*.app' || true
            exit 1
          fi
          cp -R "$src" app/Horus.app
          lipo -archs app/Horus.app/Contents/MacOS/Horus

      - name: Collect the Linux package
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p app
          found="$(find desktop/src-tauri/target/release/bundle/deb -name '*.deb' | head -n 1)"
          if [ -z "$found" ]; then
            echo "no .deb was produced"
            exit 1
          fi
          cp "$found" app/
          ls -l app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: app-${{ matrix.os }}
          path: app/
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: Horus-Beta zip
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/services/PYTHON_VERSION

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-*
          merge-multiple: true
          path: app

      - name: Every platform's app arrived
        run: |
          missing=""
          [ -f app/Horus.exe ] || missing="$missing app-windows-latest"
          [ -d app/Horus.app ] || missing="$missing app-macos-latest"
          compgen -G "app/*.deb" > /dev/null || missing="$missing app-ubuntu-22.04"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. Its upload failed (for example on a full artifact storage quota); run the build again."
            exit 1
          fi

      - name: What we are shipping
        run: |
          find app -mindepth 1 -maxdepth 2 | sort
          du -sh app

      - name: Restore the macOS executable bit
        run: |
          if [ -d app/Horus.app ]; then
            chmod +x app/Horus.app/Contents/MacOS/*
            ls -l app/Horus.app/Contents/MacOS/
          fi

      - name: Build the archive
        run: python packaging/build_bundle.py --out dist --app-dir app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: Horus-Beta-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --draft \
            --title "Horus Beta ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/RELEASE-NOTES.md
