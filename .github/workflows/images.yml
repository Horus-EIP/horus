name: Release images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  plan:
    name: Registry, tags and wiring
    runs-on: ubuntu-24.04
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      registry_host: ${{ steps.plan.outputs.registry_host }}
      version: ${{ steps.plan.outputs.version }}
      commit_tag: ${{ steps.plan.outputs.commit_tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/services/PYTHON_VERSION

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check the compose image names and this workflow
        run: python -m unittest discover -s tests/ci -p "test_release_images.py" -v

      - name: Installer unit tests
        run: python -m unittest discover -s installer/tests -t .

      - name: Version numbers match VERSION
        run: python scripts/ci/check-versions.py

      - name: The release tag names VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/ci/check-versions.py --tag "$GITHUB_REF_NAME"

      - name: Choose the registry and the tags
        id: plan
        env:
          CONFIGURED_REGISTRY: ${{ vars.HORUS_REGISTRY }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          installer_registry="$(python -c 'import sys; sys.path.insert(0, "installer"); import images; print(images.DEFAULT_REGISTRY)')"
          registry="${CONFIGURED_REGISTRY:-$installer_registry}"
          registry="${registry,,}"
          registry="${registry%/}"
          if [ "$registry" != "$installer_registry" ]; then
            echo "::warning::Pushing to $registry; installers built from this commit pull from $installer_registry unless run with --registry $registry or HORUS_REGISTRY=$registry"
          fi
          release=false
          if [[ "$GITHUB_REF" =~ ^refs/tags/v${version}(-rc[0-9]+|-rc\.[0-9]+)?$ ]]; then
            release=true
          fi
          {
            echo "registry=$registry"
            echo "registry_host=${registry%%/*}"
            echo "version=$version"
            echo "commit_tag=sha-${GITHUB_SHA::12}"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.service }} · ${{ matrix.flavor }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [mas, agent, knowledge_store, web-client, llm-mock]
        flavor: [cpu, gpu]
        exclude:
          - service: llm-mock
            flavor: gpu
        include:
          - flavor: cpu
            compose_files: docker-compose.yml:docker-compose.cpu.yml
          - flavor: gpu
            compose_files: docker-compose.yml
          - service: mas
            requirements: src/services/mas/requirements.txt
          - service: agent
            requirements: src/services/agent/requirements.txt
          - service: knowledge_store
            requirements: src/services/knowledge-store/requirements.txt
          - service: llm-mock
            compose_files: docker-compose.yml:docker-compose.cpu.yml:docker-compose.mock.yml
    env:
      SERVICE: ${{ matrix.service }}
      FLAVOR: ${{ matrix.flavor }}
      COMPOSE_FILE: ${{ matrix.compose_files }}
      HORUS_REGISTRY: ${{ needs.plan.outputs.registry }}
      HORUS_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/services/PYTHON_VERSION

      - name: Free disk space for the image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Provide the compose configuration
        run: cp src/infra/.env.example src/infra/.env

      - name: Read the image name from the profile's compose files
        working-directory: src/infra
        run: |
          image="$(docker compose config --format json | python -c 'import json, os, sys; print(json.load(sys.stdin)["services"][os.environ["SERVICE"]]["image"])')"
          case "$image" in
            "$HORUS_REGISTRY"/horus-*":$HORUS_VERSION-$FLAVOR") ;;
            *)
              echo "::error::compose names the $SERVICE image '$image', not $HORUS_REGISTRY/horus-<service>:$HORUS_VERSION-$FLAVOR"
              exit 1
              ;;
          esac
          {
            echo "IMAGE=$image"
            echo "REPOSITORY=${image%:*}"
          } >> "$GITHUB_ENV"

      - name: Build the image through the profile's compose files
        working-directory: src/infra
        run: |
          start=$(date +%s)
          docker compose --progress plain build "$SERVICE"
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Install PyYAML for the licence scan
        run: python -m pip install pyyaml

      - name: Check GPL and LGPL system packages against the source offer
        run: |
          python scripts/licences/report_image_copyleft.py \
            --service "$SERVICE" \
            --image "$IMAGE"

      - name: Fail on CUDA packages or any torch in the CPU image
        if: matrix.flavor == 'cpu' && matrix.requirements
        run: |
          docker run --rm --entrypoint python "$IMAGE" -m pip list --format=freeze > packages.txt
          python scripts/ci/check-cpu-image.py packages.txt --requirements "${{ matrix.requirements }}"

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ needs.plan.outputs.registry_host }}
          username: ${{ vars.HORUS_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.HORUS_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push the commit tag, and the version tag on a release
        env:
          COMMIT_TAG: ${{ needs.plan.outputs.commit_tag }}-${{ matrix.flavor }}
          RELEASE: ${{ needs.plan.outputs.release }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker tag "$IMAGE" "$REPOSITORY:$COMMIT_TAG"
          docker push "$REPOSITORY:$COMMIT_TAG"
          tags="$COMMIT_TAG"
          if [ "$RELEASE" = "true" ]; then
            if [[ "$REF_NAME" == *-rc* || "$REF_NAME" == *-RC* ]]; then
              RC_TAG="${REF_NAME#v}-${FLAVOR}"
              docker tag "$IMAGE" "$REPOSITORY:$RC_TAG"
              docker push "$REPOSITORY:$RC_TAG"
              tags="$tags $RC_TAG"
            else
              docker push "$IMAGE"
              tags="$tags ${IMAGE##*:}"
            fi
          fi
          digest="$(docker buildx imagetools inspect "$REPOSITORY:$COMMIT_TAG" --format '{{.Manifest.Digest}}')"
          {
            echo "PUSHED_TAGS=$tags"
            echo "DIGEST=$digest"
          } >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image by digest with this workflow's GitHub identity
        run: cosign sign --yes "$REPOSITORY@$DIGEST"

      - name: Check the signature names this workflow and commit
        run: |
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$REPOSITORY@$DIGEST" > /dev/null

      - name: Report the image
        if: always()
        run: |
          size="$(docker image inspect --format '{{.Size}}' "${IMAGE:-none}" 2>/dev/null || echo 0)"
          {
            echo "### $SERVICE · $FLAVOR"
            echo ""
            echo "- image: \`${IMAGE:-not named}\`"
            echo "- pushed tags: ${PUSHED_TAGS:-none}"
            echo "- digest: \`${DIGEST:-none}\`"
            echo "- size unpacked: $(( size / 1000000 )) MB, built in ${BUILD_SECONDS:-?} s"
          }

  bundle:
    name: Bundle · ${{ matrix.service }} · ${{ matrix.flavor }}
    needs: [plan, image]
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [mas, agent, knowledge_store, web-client, llm-mock]
        flavor: [cpu, gpu]
        exclude:
          - service: llm-mock
            flavor: gpu
        include:
          - flavor: cpu
            compose_files: docker-compose.yml:docker-compose.cpu.yml
          - flavor: gpu
            compose_files: docker-compose.yml
          - service: mas
            requirements: src/services/mas/requirements.txt
          - service: agent
            requirements: src/services/agent/requirements.txt
          - service: knowledge_store
            requirements: src/services/knowledge-store/requirements.txt
          - service: llm-mock
            compose_files: docker-compose.yml:docker-compose.cpu.yml:docker-compose.mock.yml
    env:
      SERVICE: ${{ matrix.service }}
      FLAVOR: ${{ matrix.flavor }}
      HORUS_REGISTRY: ${{ needs.plan.outputs.registry }}
      HORUS_VERSION: ${{ needs.plan.outputs.version }}
      COMMIT_TAG: ${{ needs.plan.outputs.commit_tag }}
      REF_NAME: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/services/PYTHON_VERSION


      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ needs.plan.outputs.registry_host }}
          username: ${{ vars.HORUS_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.HORUS_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Provide the compose configuration
        run: cp src/infra/.env.example src/infra/.env

      - name: Generate and package the bundle
        run: |
          BUNDLE_NAME="bundle-${{ matrix.service }}-${{ matrix.flavor }}-${{ needs.plan.outputs.version }}"
          STAGING_DIR="dist/$BUNDLE_NAME"
          mkdir -p "$STAGING_DIR"
          COMPOSE_STR="${{ matrix.compose_files }}"
          COMPOSE_FLAGS=$(echo "$COMPOSE_STR" | sed 's/:/ -f /g' | sed 's/^/-f /')
          cd src/infra
          docker compose $COMPOSE_FLAGS config > "../../$STAGING_DIR/docker-compose.yml"
          cd ../..

          cp VERSION "$STAGING_DIR/VERSION"

          if [ -n "${{ matrix.requirements }}" ] && [ -f "${{ matrix.requirements }}" ]; then
            cp "${{ matrix.requirements }}" "$STAGING_DIR/requirements.txt"
          fi

          SAFE_SERVICE="${SERVICE//_/-}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            IMAGE="${HORUS_REGISTRY}/horus-${SAFE_SERVICE}:${COMMIT_TAG}-${FLAVOR}"
          elif [[ "$REF_NAME" == *-rc* || "$REF_NAME" == *-RC* ]]; then
            RC_TAG="${REF_NAME#v}-${FLAVOR}"
            IMAGE="${HORUS_REGISTRY}/horus-${SAFE_SERVICE}:${RC_TAG}"
          else
            IMAGE="${HORUS_REGISTRY}/horus-${SAFE_SERVICE}:${HORUS_VERSION}-${FLAVOR}"
          fi
          docker pull "$IMAGE"

          python -m pip install pyyaml
          python scripts/licences/fetch-gpl-sources.py "$IMAGE" --out "$STAGING_DIR/gpl-sources"

          cd "dist/$BUNDLE_NAME"
          tar -czvf "../../${BUNDLE_NAME}.tar.gz" *
          cd ../..

      - name: Verify bundle contents and version
        run: |
          BUNDLE_FILE="bundle-${{ matrix.service }}-${{ matrix.flavor }}-${{ needs.plan.outputs.version }}.tar.gz"

          if [ ! -s "$BUNDLE_FILE" ]; then
            echo "::error::$BUNDLE_FILE archive is empty or not found."
            exit 1
          fi

          for file in "docker-compose.yml" "VERSION"; do
            if ! tar -tf "$BUNDLE_FILE" | grep -q "$file"; then
              echo "::error::Invalid Bundle : $file is missing."
              exit 1
            fi
          done

          tar -tvf "$BUNDLE_FILE"
          if [ -n "${{ matrix.requirements }}" ]; then
            if ! tar -tf "$BUNDLE_FILE" | grep -q "requirements.txt"; then
              echo "::error::Invalid Bundle : requirements.txt is missing."
              exit 1
            fi
            if ! tar -tf "$BUNDLE_FILE" | grep -q "gpl-sources"; then
              echo "::error::Invalid Bundle : gpl-sources folder is missing for this service."
              exit 1
            fi
          fi

          ARCHIVE_VERSION=$(tar -xOf "$BUNDLE_FILE" VERSION | tr -d '[:space:]')
          if [ "$ARCHIVE_VERSION" != "${HORUS_VERSION}" ]; then
            echo "::error::Mismatch de version ! L'archive contient $ARCHIVE_VERSION mais on attend ${HORUS_VERSION}."
            exit 1
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.4.0
        with:
          name: bundle-${{ matrix.service }}-${{ matrix.flavor }}
          path: bundle-${{ matrix.service }}-${{ matrix.flavor }}-${{ needs.plan.outputs.version }}.tar.gz
          retention-days: 14


  release:
    name: Create GitHub Release
    needs: [plan, image, bundle]
    if: needs.plan.outputs.release == 'true' # Uniquement si c'est un tag de version (v*)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: bundle-*
          path: all-bundles

      - name: Flatten directory structure
        run: |
          mkdir -p assets
          find all-bundles -name "*.tar.gz" -exec cp {} assets/ \;
          ls -lh assets/

      - name: Publish Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-RC') }}
        run: |
          shopt -s nullglob
          assets=(assets/*.tar.gz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No bundle archives were generated."
            exit 1
          fi

          args=(--title "Release $RELEASE_VERSION" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${args[@]}"