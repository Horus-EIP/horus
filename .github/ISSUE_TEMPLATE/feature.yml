name: Feature request
description: A new tool, option or report field.
labels: [enhancement, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to measure or do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would work for you. A command line or a report excerpt helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Taking part
      options:
        - label: I would like to work on it myself.
