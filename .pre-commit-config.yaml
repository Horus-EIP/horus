# Pre-commit hooks for Horus AI.
#
# Install:    pre-commit install
# Run all:    pre-commit run --all-files
#
# The hooks run against the Python tree under `src/` (services) and `scripts/`.
# See pyproject.toml for ruff / mypy configuration.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: docstring-length
        name: Cap triple-quoted blocks at 40 lines
        description: >
          Flags module / class / function docstrings longer than 40 lines so
          long-form narrative lives in docs/architecture/ instead of inline.
        entry: python scripts/ci/check_docstring_length.py --max-lines 40
        language: system
        types: [python]
        exclude: |
          (?x)^(
            .*/alembic/versions/.*|
            .*/migrations/.*|
            tests/.*
          )$
