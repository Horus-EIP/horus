global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'mas-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mas:8000']

  - job_name: 'agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['agent:8001']

  - job_name: 'knowledge-store'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['knowledge_store:8080']