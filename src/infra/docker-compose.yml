# Horus stack (single Compose file).
#
# GPU (NVIDIA): `mas`, `agent`, and `knowledge_store` request `gpus: all`. Install the
# NVIDIA Container Toolkit so Docker exposes CUDA. If your host has no GPU (or Compose
# errors on startup), comment out the `gpus: all` lines under those three services, or set
# `LLM_FORCE_CPU=1` / `MODEL_DEVICE=cpu` in `.env` so workloads fall back to CPU inside the
# containers where supported.
#
# Eager LLMs: the agent loads the decision model at startup (`AGENT_LAZY_DECISION_MODEL=0`),
# so the first chat does not pay a one-time load cost (container start is slower instead).

services:
  # =============================================================================
  # CORE APPLICATION SERVICES
  # =============================================================================
  
  rabbitmq:
    image: rabbitmq:4.1.2-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    networks:
      - horus-net
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  mas:
    build:
      context: ../services/mas
      dockerfile: Dockerfile
      args:
        # Set DOWNLOAD_LLM=0 for air-gapped builds and copy models into context instead (see docs).
        DOWNLOAD_LLM: ${DOWNLOAD_LLM:-1}
    container_name: mas
    mem_limit: 14g
    memswap_limit: 16g
    gpus: all
    env_file:
      - .env
    environment:
      # Must be the Docker service name, not localhost (compose passes .env which may use localhost for host-side tools).
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      # Internal AMQP port inside the stack (not the host mapping in RABBITMQ_PORT)
      - RABBITMQ_PORT=5672
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SUPER_USER_USERNAME=${SUPER_USER_USERNAME}
      - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - LLM_AUTOINIT=${LLM_AUTOINIT:-1}
      # 0 = use CUDA when the container sees a GPU (`gpus: all` above). 1 = CPU-only orchestrator LLM.
      - LLM_FORCE_CPU=${LLM_FORCE_CPU:-0}
      # OpenTelemetry - Send to Tempo
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=mas
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - JSON_LOGGING=true
      - LOG_LEVEL=INFO
      # Wall-clock cap for RUNNING tasks (LLM + agent). TASK_TIMEOUT_SECONDS also accepted by MAS settings.
      - TASK_TIMEOUT=${TASK_TIMEOUT:-1800}
      # Offline by default after image build; set to 0 in .env to allow Hub at runtime.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    healthcheck:
      # HTTP is only accepted after lifespan completes (DB + RabbitMQ); this gates dependents.
      # Use a generous timeout: a single Uvicorn worker can be busy with HF/LLM I/O; short
      # timeouts falsely mark the service unhealthy while chat requests are still in flight.
      test: ["CMD", "curl", "-f", "-m", "25", "-X", "POST", "http://localhost:8000/rabbitmq/heartbeat"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 180s
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - horus-net

  web-client:
    build:
      context: ../services/web-client
      dockerfile: Dockerfile
      args:
        ORCHESTRATOR_URL: http://mas:8000
        NEXT_PUBLIC_KNOWLEDGE_STORE_URL: http://localhost:8080
    container_name: web_client
    depends_on:
      mas:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - horus-net
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - ORCHESTRATOR_URL=http://mas:8000
      - NEXT_PUBLIC_KNOWLEDGE_STORE_URL=http://localhost:8080

  agent:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
      args:
        DOWNLOAD_LLM: ${DOWNLOAD_LLM:-1}
    container_name: agent
    # Agent inference (Qwen instruct decision LLM, spaCy tools, etc.): NVIDIA Container Toolkit on the host.
    # No GPU? Remove the next line or run without requesting devices (Compose will error if unsupported).
    gpus: all
    env_file:
      - .env
    environment:
      # Overrides host-oriented .env (localhost) with Docker network hosts.
      - ORCHESTRATOR_URL=http://mas:8000
      - ORCHESTRATOR_USERNAME=${SUPER_USER_USERNAME}
      - ORCHESTRATOR_PASSWORD=${SUPER_USER_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - KNOWLEDGE_STORE_URL=http://knowledge_store:8080
      - KNOWLEDGE_STORE_TIMEOUT=10.0
      - KNOWLEDGE_STORE_MAX_RETRIES=3
      - KNOWLEDGE_STORE_RETRY_DELAY=1.0
      # auto = use CUDA inside the container when visible; set MODEL_DEVICE=cpu in .env to force CPU only.
      - MODEL_DEVICE=${MODEL_DEVICE:-auto}
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen3-4B-Instruct-2507}
      # 0 = load Qwen at agent startup (ready for first chat; slower container boot).
      - AGENT_LAZY_DECISION_MODEL=${AGENT_LAZY_DECISION_MODEL:-0}
      - AGENT_SPACY_PREFER_SM=1
      # OpenTelemetry instrumentation for Tempo
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    depends_on:
      mas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      knowledge_store:
        condition: service_started
    ports:
      - "8001:8001"
    networks:
      - horus-net
    volumes:
      - ../services/agent/app:/app

  knowledge_store:
    build:
      context: ../services/knowledge-store
      dockerfile: Dockerfile
    container_name: knowledge_store
    gpus: all
    environment:
      - CHROMA_TELEMETRY_ENABLED=0
      - POSTHOG_DISABLED=true
      - SENTENCE_TRANSFORMERS_NO_TELEMETRY=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # OpenTelemetry instrumentation for Tempo
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=knowledge-store
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    ports:
      - "8080:8080"
    networks:
      - horus-net
    volumes:
      - knowledge_store_documents:/documents
      - knowledge_store_chroma:/chroma_data

  # =============================================================================
  # DATA STORES
  # =============================================================================

  postgres:
    image: postgres:latest
    container_name: postgres
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c 'shared_preload_libraries=pg_stat_statements' -c 'pg_stat_statements.track=all'
    ports:
      - "${DB_PORT}:5432"
    networks:
      - horus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - .env
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - horus-net
    restart: unless-stopped

  # =============================================================================
  # ADMIN TOOLS
  # =============================================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres
    ports:
      - "5433:80"
    networks:
      - horus-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    depends_on:
      - redis
    ports:
      - "5540:5540"
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    networks:
      - horus-net

  # =============================================================================
  # OBSERVABILITY - Grafana + Tempo + Prometheus (Simple & Reliable)
  # Single UI at http://localhost:3301 for traces and metrics
  # =============================================================================

  # Tempo - Distributed tracing backend (receives OTLP traces)
  # Pin to Tempo 2.x: `latest` (Tempo 3+) expects Kafka topics; this repo uses local disk only (see grafana/tempo.yaml).
  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./grafana/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - horus-net
    restart: unless-stopped

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./grafana/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - horus-net
    restart: unless-stopped

  # Grafana - Single UI for traces and metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3301:3000"
    depends_on:
      - tempo
      - prometheus
    networks:
      - horus-net
    restart: unless-stopped

networks:
  horus-net:
    driver: bridge

volumes:
  knowledge_store_documents: {}
  knowledge_store_chroma: {}
  postgresql_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
  redisinsight_data:
  tempo_data:
  prometheus_data:
  grafana_data:
