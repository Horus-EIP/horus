[pytest]
pythonpath = ../../src/services/llm-mock .
testpaths = .
addopts = -m "not real_llm and not real_embeddings"
markers =
    real_llm: runs the contract against a real OpenAI-compatible model server, named by
        HORUS_CONTRACT_LLM_URL (and HORUS_CONTRACT_LLM_MODEL). Deselected by default; run with
        -m real_llm.
    real_embeddings: runs the embeddings contract against real OpenAI-compatible embeddings
        servers, named by HORUS_CONTRACT_MAS_EMBED_URL and HORUS_CONTRACT_KNOWLEDGE_STORE_EMBED_URL
        (and their _MODEL settings). Deselected by default; run with -m real_embeddings.
