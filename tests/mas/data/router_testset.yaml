  5_IT_Security_Policy.md: [Compliance-Officer]
roster:
  - name: General-Assistant
    type: general
    skills: [knowledge_retrieval, decision_making, rag_pipeline]
    description: "General-purpose RAG assistant. Default fallback when no specialised agent matches the demand."
  - name: Finance-Analyst
    type: analyst
    skills: [financial_analysis, quarterly_report_qa, revenue_breakdown, expense_review, budget_summary, knowledge_retrieval]
    description: "Financial analysis specialist. Grounded in the Q4 2025 Financial Report and the Expense Policy."
  - name: Compliance-Officer
    type: analyst
    skills: [compliance_check, policy_review, audit, gdpr, sox, mica, finra, data_protection, it_security_policy, access_control, incident_response, knowledge_retrieval]
    description: "Policy and compliance reviewer. Grounded in the Compliance Guidelines and the IT Security Policy."
  - name: HR-Assistant
    type: general
    skills: [hr_policy, employee_handbook, leave_policy, benefits_qa, remote_work_policy, code_of_conduct, expense_review, knowledge_retrieval]
    description: "HR specialist. Grounded in the Employee Handbook and the Expense Policy."
  - name: Researcher
    type: researcher
    skills: [research, literature_review, citation_lookup, knowledge_retrieval]
    description: "Multi-source researcher. Pulls and synthesises information across the knowledge store."
