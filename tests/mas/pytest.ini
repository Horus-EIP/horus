[pytest]
pythonpath = ../../src/services/mas
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    requires_stack: opt-in. Test needs the live Docker stack (Postgres, Redis,
        RabbitMQ, ChromaDB). Skipped by default. Run with `pytest -m requires_stack`.
    regression: ATP regression test. The ATP id is in the test name. Run with `pytest -m regression`.
    requires_model: needs FastEmbed's sentence-transformers/all-MiniLM-L6-v2 embedder on disk
        (MAS image or FastEmbed cache). Skipped when it is missing; never downloads it.
