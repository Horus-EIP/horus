[pytest]
pythonpath = ../../src/services/agent/app
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    requires_stack: opt-in. Test needs the live Docker stack. Skipped by default.
filterwarnings =
    ignore:.*SwigPy.*:DeprecationWarning
    ignore:.*swigvarlink.*:DeprecationWarning
