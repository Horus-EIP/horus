[pytest]
pythonpath = ../../src/services/knowledge-store
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    requires_stack: opt-in. Test needs the live Docker stack. Skipped by default.
    requires_model: runs the real BGE model with FastEmbed. Skipped when the model is not in the
        FastEmbed cache; HORUS_REQUIRE_MODEL_TESTS=1 makes that a failure, as in CI.
filterwarnings =
    ignore:.*SwigPy.*:DeprecationWarning
    ignore:.*swigvarlink.*:DeprecationWarning
